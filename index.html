<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FilmFestivals — em breve</title>
  <meta name="description" content="Uma timeline dos filmes premiados nos principais festivais de cinema. Em construção.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:opsz,wght@14..32,100..900&display=swap">
  <style>
    :root {
      --bg: #0e0f13;
      --txt: #e8eaf0;
      --muted: #9aa0b0;
      --accent: #f5c518;
      --accent-2: #6ea8fe;
    }

    * { box-sizing: border-box }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--txt);
      font: 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main { max-width: 560px; text-align: center }

    .icons {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .icons img {
      width: 44px;
      height: 44px;
      opacity: .9;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1.05;
      margin: 0 0 16px;
    }

    h1 .accent { color: var(--accent) }

    p { color: var(--muted); margin: 0 auto; max-width: 42ch }

    .tag {
      display: inline-block;
      margin-top: 28px;
      padding: 6px 14px;
      border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <div class="icons">
      <img src="assets/oscar.svg" alt="Oscar">
      <img src="assets/palme-dor.svg" alt="Palma de Ouro">
    </div>
    <h1>Film<span class="accent">Festivals</span></h1>
    <p>Uma timeline navegável dos filmes premiados nos principais festivais de cinema. Sem ranking, sem nota — só as vitórias que importam.</p>
    <span class="tag">Em construção</span>
  </main>
</body>

</html>
